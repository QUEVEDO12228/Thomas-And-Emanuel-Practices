<div class="parkalia-register-step1-layout">
    <!--========================== BANNER IZQUIERDO ==========================-->
    <aside class="parkalia-register-step1-banner">
        <img src="/frontend/public/assets/images/img_parquing.avif" alt="Registro Parkalia" class="parkalia-register-step1-banner__image">
        <div class="parkalia-register-step1-banner__overlay"></div>
        <div class="parkalia-register-step1__topbar">
            <a href="javascript:history.back()" class="parkalia-btn-secondary parkalia-recipients-table__btn-secondary">
                <img src="/frontend/public/assets/icons/icon_back.svg" alt="" class="parkalia-btn-secondary__icon parkalia-recipients-table__btn-secondary-icon">
            </a>
        </div>
        <header class="parkalia-register-step1__header">
            <h1 class="parkalia-register-step1__title"> Completa tu registro</h1>
            <p class="parkalia-register-step1__subtitle">Últimas configuraciones para activar tu<strong class="parkalia-register-step1__highlight">parkalia</strong></p>
        </header>
        <div class="parkalia-register-step1-banner__card">
            <span class="parkalia-register-step1-banner__badge">PARKALIA SECURITY</span>
            <h2 class="parkalia-register-step1-banner__title">Configuración inteligente</h2>
            <p class="parkalia-register-step1-banner__text">Define las preferencias del sistema y acepta las condiciones para comenzar a operar tu parqueadero.</p>
        </div>
    </aside>
    <section class="parkalia-register-step1">
        <div class="parkalia-register-step1__card">
            <form class="parkalia-register-step1__form">
                <div class="parkalia-register-step1__field">
                    <label class="parkalia-register-step1__label">¿Mostrar precios públicamente?</label>
                    <select class="parkalia-register-step1__select">
                        <option>Sí</option>
                        <option>No</option>
                    </select>
                </div>
                <div class="parkalia-register-step1__field">
                    <label class="parkalia-register-step1__label">¿Mostrar disponibilidad?</label>
                    <select class="parkalia-register-step1__select">
                        <option>Sí</option>
                        <option>No</option>
                    </select>
                </div>
                <div class="parkalia-register-step1__field">
                    <label class="parkalia-register-step1__label">¿Aceptar reservas automáticamente?</label>
                    <select class="parkalia-register-step1__select">
                        <option>Sí</option>
                        <option>No</option>
                    </select>
                </div>
                <!-- ====================== INFORMACIÓN ADICIONAL ======================= -->
                <div class="parkalia-register-step1__field">
                    <label class="parkalia-register-step1__label">¿Cómo conoció Parkalia?</label>
                    <select class="parkalia-register-step1__select">
                        <option>Google</option>
                        <option>Facebook</option>
                        <option>Instagram</option>
                        <option>TikTok</option>
                        <option>Publicidad</option>
                        <option>Recomendación</option>
                        <option>Otro</option>
                    </select>
                </div>
                <div class="parkalia-register-step1__field">
                    <label class="parkalia-register-step1__label">Comentarios adicionales</label>
                    <textarea class="parkalia-register-step1__textarea"></textarea>
                </div>
                <!-- ====================== TÉRMINOS ======================= -->
                <div class="parkalia-register-step1__field">
                    <label class="parkalia-register-step1__label">Vehículos permitidos</label>
                    <div class="parkalia-register-step1__content-label-largos">
                        <label><input type="checkbox"> Confirmo que la información<br>suministrada es verdadera.</label>
                        <label><input type="checkbox"> Acepto los Términos y Condiciones.</label>
                        <label><input type="checkbox"> Acepto la Política de Privacidad.</label>
                        <label><input type="checkbox"> Autorizo el tratamiento de datos personales.</label>
                        <label><input type="checkbox"> Autorizo a Parkalia a verificar la información suministrada.</label>
                        <label><input type="checkbox"> Acepto recibir notificaciones relacionadas con mi cuenta.</label>
                    </div>
                </div>
            </form>
            <div class="parkalia-register__button-primary">
                <a href="/frontend/src/html/pages/registers/view_parkalia_register.html" class="parkalia-btn parkalia-btn--primary parkalia-login__parkalia-btn--primary parkalia-btn--expand">
                    <span class="parkalia-btn__text">Siguiente</span><img src="/frontend/public/assets/icons/icon_next-white.svg" alt="" class="parkalia-btn__icon">
                </a>
            </div>
        </div>
    </section>
</div>
