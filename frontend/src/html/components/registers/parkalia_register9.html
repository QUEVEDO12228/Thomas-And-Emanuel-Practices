<section class="parkalia-register-step1-page">
  <div class="parkalia-register-step1-page__glow parkalia-register-step1-page__glow--left"></div>
  <div class="parkalia-register-step1-page__glow parkalia-register-step1-page__glow--right"></div>
  <div class="parkalia-register-step1-layout">
    <section class="parkalia-register-step1">
      <div class="parkalia-register-step1__card">
        <div class="parkalia-register-step1__topbar">
            <a href="javascript:history.back()" alt="Volver" class="parkalia-btn-secondary parkalia-recipients-table__btn-secondary">
                <img src="/frontend/public/assets/icons/icon_back.svg" alt="" class="parkalia-btn-secondary__icon parkalia-recipients-table__btn-secondary-icon">
            </a>
        </div>
        <header class="parkalia-register-step1__header">
          <h1 class="parkalia-register-step1__title">Completa tu registro</h1>
          <p class="parkalia-register-step1__subtitle">Último paso para crear tu cuenta en<strong class="parkalia-register-step1__highlight">parkalia</strong></p>
        </header>
        <form class="parkalia-register-step1__form">
          <!-- ===================================================== -->
          <!-- GALERÍA DE IMÁGENES -->
          <!-- ===================================================== -->

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Logo del parqueadero *</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Imagen de portada *</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Fotografía de la fachada *</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Fotografía de la entrada principal</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Fotografía de la salida</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Zona de automóviles</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Zona de motocicletas</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Zona de bicicletas</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Recepción o caja</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Sala de espera</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Baños</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Zona de carga eléctrica</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Vista aérea (Drone)</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Galería adicional</label>
              <input type="file" class="parkalia-register-step1__file" accept="image/*" multiple>
          </div>

          <!-- ===================================================== -->
          <!-- VIDEOS -->
          <!-- ===================================================== -->

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Video de presentación</label>
              <input type="file" class="parkalia-register-step1__file" accept="video/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Video recorrido</label>
              <input type="file" class="parkalia-register-step1__file" accept="video/*">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Video de seguridad</label>
              <input type="file" class="parkalia-register-step1__file" accept="video/*">
          </div>

          <!-- ===================================================== -->
          <!-- DOCUMENTOS -->
          <!-- ===================================================== -->

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">RUT *</label>
              <input type="file" class="parkalia-register-step1__file" accept=".pdf,.jpg,.png">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Cámara de Comercio</label>
              <input type="file" class="parkalia-register-step1__file" accept=".pdf">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Licencia de funcionamiento</label>
              <input type="file" class="parkalia-register-step1__file" accept=".pdf">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Póliza o seguro</label>
              <input type="file" class="parkalia-register-step1__file" accept=".pdf">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Documento del representante legal</label>
              <input type="file" class="parkalia-register-step1__file" accept=".pdf,.jpg,.png">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Certificación bancaria</label>
              <input type="file" class="parkalia-register-step1__file" accept=".pdf">
          </div>

          <!-- ===================================================== -->
          <!-- PERFIL PÚBLICO -->
          <!-- ===================================================== -->

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Título del perfil</label>
              <input type="text" class="parkalia-register-step1__input">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Descripción pública</label>
              <textarea class="parkalia-register-step1__textarea" rows="6"></textarea>
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">Palabras clave</label>
              <input type="text" class="parkalia-register-step1__input" placeholder="Centro, Seguro, 24 horas, Cubierto...">
          </div>

          <div class="parkalia-register-step1__field">
              <label class="parkalia-register-step1__label">URL personalizada</label>
              <input type="text" class="parkalia-register-step1__input" placeholder="parkalia.com/p/mi-parqueadero">
          </div>
        </form>
        <div class="parkalia-register__button-primary">
          <a href="/frontend/src/html/pages/registers/view_parkalia_register10.html" class="parkalia-btn parkalia-btn--primary parkalia-login__parkalia-btn--primary parkalia-btn--expand">
              <span class="parkalia-btn__text">Siguiente</span>
              <img src="/frontend/public/assets/icons/icon_next-white.svg" alt="" class="parkalia-btn__icon">
          </a>
        </div>
      </div>
    </section>
    <aside class="parkalia-register-step1-banner">
      <img src="/frontend/public/assets/images/img_banking7.webp" alt="parkalia" class="parkalia-register-step1-banner__image">
      <div class="parkalia-register-step1-banner__overlay"></div>
      <div class="parkalia-register-step1-banner__card">
        <span class="parkalia-register-step1-banner__badge">parkalia SECURITY</span>
        <h1 class="parkalia-register-step1-banner__title">Seguridad avanzada</h1>
        <p class="parkalia-register-step1-banner__text">Protegemos tu cuenta con tecnología de última generación.</p>
      </div>
    </aside>
  </div>
</section>
