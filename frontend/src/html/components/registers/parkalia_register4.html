<section class="parkalia-register-step1-page">
  <div class="parkalia-register-step1-page__glow parkalia-register-step1-page__glow--left"></div>
  <div class="parkalia-register-step1-page__glow parkalia-register-step1-page__glow--right"></div>
  <div class="parkalia-register-step1-layout">
    <section class="parkalia-register-step1">
      <div class="parkalia-register-step1__card">
        <div class="parkalia-register-step1__topbar">
            <a href="javascript:history.back()" alt="Volver" class="parkalia-btn-secondary parkalia-recipients-table__btn-secondary">
                <img src="/frontend/public/assets/icons/icon_back.svg" alt="" class="parkalia-btn-secondary__icon parkalia-recipients-table__btn-secondary-icon">
            </a>
        </div>
        <header class="parkalia-register-step1__header">
          <h1 class="parkalia-register-step1__title">Completa tu registro</h1>
          <p class="parkalia-register-step1__subtitle">Último paso para crear tu cuenta en<strong class="parkalia-register-step1__highlight">parkalia</strong></p>
        </header>
        <form class="parkalia-register-step1__form">
        <!-- ===================================================== -->
        <!-- CARACTERÍSTICAS DEL PARQUEADERO -->
        <!-- ===================================================== -->
         <!-- ===================================================== -->
          <!-- VEHÍCULOS PERMITIDOS -->
          <!-- ===================================================== -->

          <div class="parkalia-register-step1__field">
            <label class="parkalia-register-step1__label">Vehículos permitidos</label>
            <div class="parkalia-register-step1__content-label">
              <label><input type="checkbox"> Automóvil</label>
              <label><input type="checkbox"> Camioneta</label>
              <label><input type="checkbox"> SUV</label>
              <label><input type="checkbox"> PickUp</label>
              <label><input type="checkbox"> Moto</label>
              <label><input type="checkbox"> Bicicleta</label>
              <label><input type="checkbox"> Patineta eléctrica</label>
              <label><input type="checkbox"> Scooter</label>
              <label><input type="checkbox"> Camión</label>
              <label><input type="checkbox"> Furgón</label>
              <label><input type="checkbox"> Bus</label>
              <label><input type="checkbox"> Vehículo eléctrico</label>
            </div>

          </div>

          <div class="parkalia-register-step1__field">
            <label class="parkalia-register-step1__label">Tipo de parqueadero *</label>
              <select class="parkalia-register-step1__select">
              <option>Público</option>
              <option>Privado</option>
              <option>Mixto</option>
            </select>
          </div>

          <div class="parkalia-register-step1__field">
            <label class="parkalia-register-step1__label">Modalidad *</label>
              <select class="parkalia-register-step1__select">
              <option>Cubierto</option>
              <option>Descubierto</option>
              <option>Mixto</option>
            </select>
          </div>

          <div class="parkalia-register-step1__field">
            <label class="parkalia-register-step1__label">Capacidad total *</label>
          <div class="parkalia-register-step1__input-wrapper">
          <input type="number" class="parkalia-register-step1__input">
          </div>
          </div>

          <div class="parkalia-register-step1__field">
            <label class="parkalia-register-step1__label">Número de pisos</label>
          <div class="parkalia-register-step1__input-wrapper">
          <input type="number" class="parkalia-register-step1__input">
          </div>
          </div>

          <div class="parkalia-register-step1__field">
            <label class="parkalia-register-step1__label">Área total (m²)</label>
          <div class="parkalia-register-step1__input-wrapper">
          <input type="number" class="parkalia-register-step1__input">
          </div>
          </div>

          <div class="parkalia-register-step1__field">
            <label class="parkalia-register-step1__label">Altura máxima permitida (m)</label>
          <div class="parkalia-register-step1__input-wrapper">
          <input type="number" step="0.01" class="parkalia-register-step1__input">
          </div>
          </div>

          <div class="parkalia-register-step1__field">
            <label class="parkalia-register-step1__label">Número de entradas</label>
            <div class="parkalia-register-step1__input-wrapper">
              <input type="number" class="parkalia-register-step1__input">
            </div>
          </div>

          <div class="parkalia-register-step1__field">
            <label class="parkalia-register-step1__label">Número de salidas</label>
            <div class="parkalia-register-step1__input-wrapper">
              <input type="number" class="parkalia-register-step1__input">
            </div>
          </div>

          <div class="parkalia-register-step1__field">
            <label class="parkalia-register-step1__label">Tiempo máximo permitido (horas)</label>
            <div class="parkalia-register-step1__input-wrapper">
              <input type="number" class="parkalia-register-step1__input">
            </div>
          </div>

          <div class="parkalia-register-step1__field">
            <label class="parkalia-register-step1__label">Tiempo mínimo de permanencia (min)</label>
            <div class="parkalia-register-step1__input-wrapper">
            <input type="number" class="parkalia-register-step1__input">
            </div>
          </div>
        </form>
        <div class="parkalia-register__button-primary">
          <a href="/frontend/src/html/pages/registers/view_parkalia_register5.html" class="parkalia-btn parkalia-btn--primary parkalia-login__parkalia-btn--primary parkalia-btn--expand">
              <span class="parkalia-btn__text">Siguiente</span>
              <img src="/frontend/public/assets/icons/icon_next-white.svg" alt="" class="parkalia-btn__icon">
          </a>
        </div>
      </div>
    </section>
    <aside class="parkalia-register-step1-banner">
      <img src="/frontend/public/assets/images/img_banking7.webp" alt="parkalia" class="parkalia-register-step1-banner__image">
      <div class="parkalia-register-step1-banner__overlay"></div>
      <div class="parkalia-register-step1-banner__card">
        <span class="parkalia-register-step1-banner__badge">parkalia SECURITY</span>
        <h1 class="parkalia-register-step1-banner__title">Seguridad avanzada</h1>
        <p class="parkalia-register-step1-banner__text">Protegemos tu cuenta con tecnología de última generación.</p>
      </div>
    </aside>
  </div>
</section>
