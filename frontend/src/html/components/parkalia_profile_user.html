<section class="parkalia-profile-page">
    <div class="parkalia-profile-page__glow parkalia-profile-page__glow--left"></div>
    <div class="parkalia-profile-page__glow parkalia-profile-page__glow--right"></div>
    <section class="parkalia-profile">
        <div class="parkalia-profile__container">
            <div class="parkalia-profile-card__content-button">
                <section class="parkalia-profile-card">
                    <div class="parkalia-profile-card__cover"></div>

                    <div class="parkalia-profile-card__content">

                        <a href="javascript:history.back()"
                        class="parkalia-profile-card__back parkalia-btn-secondary">
                            <img src="/frontend/public/assets/icons/icon_back.svg"
                                alt="Volver"
                                class="parkalia-btn-secondary__icon">
                        </a>

                        <div class="parkalia-profile-card__avatar">
                            <img src="/frontend/public/assets/images/profile.jpg"
                                alt="Usuario"
                                class="parkalia-profile-card__image">
                        </div>

                        <div class="parkalia-profile-card__info">
                            <h2 class="parkalia-profile-card__name">Información Personal</h2>
                            <span class="parkalia-profile-card__role">Administrador General</span>
                            <span class="parkalia-profile-card__status">● Cuenta Activa</span>
                        </div>

                        <div class="parkalia-profile-card__actions">
                            <div class="parkalia-profile-form__field parkalia-profile-form__field--full">
                                <label class="parkalia-profile-form__label">Notificaciones</label>
                                <div class="parkalia-profile-form__checks">
                                    <label><input type="checkbox" checked>Correo Electrónico</label>
                                    <label><input type="checkbox" checked>WhatsApp</label>
                                    <label><input type="checkbox">SMS</label>
                                    <label><input type="checkbox" checked>Push</label>
                                </div>
                            </div>
                        </div>

                    </div>
                </section>
            </div>
                <form class="parkalia-profile-form">
                    <div class="parkalia-profile-form__field">
                        <label class="parkalia-profile-form__label">Nombre Completo</label>
                        <input type="text" class="parkalia-profile-form__input" value="Juan David Rodríguez">
                    </div>
                    <div class="parkalia-profile-form__field">
                        <label class="parkalia-profile-form__label">Tipo Documento</label>
                        <select class="parkalia-profile-form__select"><option>Cédula de Ciudadanía</option></select>
                    </div>
                    <div class="parkalia-profile-form__field">
                        <label class="parkalia-profile-form__label">Número Documento</label>
                        <input type="text" class="parkalia-profile-form__input" value="1000123456">
                    </div>
                    <div class="parkalia-profile-form__field">
                        <label class="parkalia-profile-form__label">Correo Electrónico</label>
                        <input type="email" class="parkalia-profile-form__input" value="juan@parkalia.com">
                    </div>
                    <div class="parkalia-profile-form__field">
                        <label class="parkalia-profile-form__label">Teléfono</label>
                        <input type="text" class="parkalia-profile-form__input" value="+57 300 000 0000">
                    </div>
                    <div class="parkalia-profile-form__field">
                        <label class="parkalia-profile-form__label">Fecha Nacimiento</label>
                        <input type="date" class="parkalia-profile-form__input">
                    </div>
                    <div class="parkalia-profile-form__field">
                        <label class="parkalia-profile-form__label">Usuario</label>
                        <input type="text" class="parkalia-profile-form__input" value="juandavid">
                    </div>
                    <div class="parkalia-profile-form__field">
                        <label class="parkalia-profile-form__label">Rol</label>
                        <input type="text" class="parkalia-profile-form__input" value="Administrador" readonly>
                    </div>
                    <div class="parkalia-profile-form__field">
                        <label class="parkalia-profile-form__label">Estado</label>
                        <input type="text" class="parkalia-profile-form__input" value="Activo" readonly>
                    </div>
                    <div class="parkalia-profile-form__field">

                        <label class="parkalia-profile-form__label">
                            Último Acceso
                        </label>

                        <input
                            type="text"
                            class="parkalia-profile-form__input"
                            value="24/06/2026 - 08:42 PM"
                            readonly>

                    </div>

                    <div class="parkalia-profile-form__field">

                        <label class="parkalia-profile-form__label">
                            Fecha Registro
                        </label>

                        <input
                            type="text"
                            class="parkalia-profile-form__input"
                            value="12/02/2026"
                            readonly>

                    </div>

                    <div class="parkalia-profile-form__field">

                        <label class="parkalia-profile-form__label">
                            Empresa
                        </label>

                        <input
                            type="text"
                            class="parkalia-profile-form__input"
                            value="Parkalia S.A.S."
                            readonly>

                    </div>

                    

                </form>

            </section>

            <!--=========================================
            =            BUTTONS
            ==========================================-->

            <div class="parkalia-profile__buttons">

                <a href="#" class="parkalia-btn parkalia-btn--primary">

                    <span class="parkalia-btn__text">
                        Guardar Cambios
                    </span>

                </a>

            </div>

        </div>

    </section>

</section>
