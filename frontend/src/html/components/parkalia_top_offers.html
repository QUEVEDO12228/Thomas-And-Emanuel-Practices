<section class="parkalia-section-card-top-offer">

    <h1 class="parkalia-section-card-top-offer__title">
        Inspirado en lo último que viste
    </h1>

    <div class="parkalia-section-card-top-offer__slider">

        <!-- Flecha izquierda -->
        <button
            type="button"
            class="parkalia-section-card-top-offer__arrow parkalia-section-card-top-offer__arrow--left">

            <img
                src="/frontend/public/assets/icons/icon_arrow_left.svg"
                alt="Anterior"
                class="parkalia-section-card-top-offer__arrow-icon">

        </button>

        <!-- Área visible -->
        <div class="parkalia-section-card-top-offer__viewport">

            <!-- El JS insertará aquí las tarjetas -->
            <div class="parkalia-section-card-top-offer__track">

            </div>

        </div>

        <!-- Flecha derecha -->
        <button
            type="button"
            class="parkalia-section-card-top-offer__arrow parkalia-section-card-top-offer__arrow--right">

            <img
                src="/frontend/public/assets/icons/icon_arrow_right.svg"
                alt="Siguiente"
                class="parkalia-section-card-top-offer__arrow-icon">

        </button>

    </div>

</section>
