<section class="parkalia-register-step6-page">
  <div class="parkalia-register-step6-page__glow parkalia-register-step6-page__glow--left"></div>
  <div class="parkalia-register-step6-page__glow parkalia-register-step6-page__glow--right"></div>
  <div class="parkalia-register-step6-layout">
    <section class="parkalia-register-step6">
      <div class="parkalia-register-step6__card">
        <div class="parkalia-register-step6__topbar">
            <a href="javascript:history.back()" alt="Volver" class="parkalia-btn-secondary parkalia-recipients-table__btn-secondary">
                <img src="/frontend/public/assets/icons/icon_back.svg" alt="" class="parkalia-btn-secondary__icon parkalia-recipients-table__btn-secondary-icon">
            </a>
        </div>
        <header class="parkalia-register-step6__header">
          <h6 class="parkalia-register-step6__title">Completa tu registro</h6>
          <p class="parkalia-register-step6__subtitle">Último paso para crear tu cuenta en<strong class="parkalia-register-step6__highlight">parkalia</strong></p>
        </header>
        <form class="parkalia-register-step6__form">
          <div class="parkalia-register-step6__field">
            <label class="parkalia-register-step6__label">Foto de perfil</label>
            <div class="parkalia-register-step6__photo-upload">
              <div class="parkalia-register-step6__photo-preview">
                <img src="/frontend/public/assets/icons/icon_user_placeholder.svg" alt="Foto de perfil" class="parkalia-register-step6__photo-img">
                <button type="button" class="parkalia-register-step6__photo-btn"><img src="/frontend/public/assets/icons/icon_camera.svg" alt=""></button>
              </div>
              <input type="file" accept="image/*" class="parkalia-register-step6__photo-input">
              <p class="parkalia-register-step6__photo-hint">JPG, PNG o WEBP. Máx 5MB</p>
            </div>
          </div>
          <div class="parkalia-register-step6__field">
            <label class="parkalia-register-step6__label">Correo electrónico</label>
            <div class="parkalia-register-step6__input-wrapper">
              <img src="/frontend/public/assets/icons/icon_email.svg" class="parkalia-register-step6__input-icon" alt="">
              <input type="email" class="parkalia-register-step6__input" placeholder="correo@parkalia.com">
            </div>
          </div>
          <div class="parkalia-register-step6__field">
            <label class="parkalia-register-step6__label">Contraseña</label>
            <div class="parkalia-register-step6__input-wrapper">
              <img src="/frontend/public/assets/icons/icon_password.svg" class="parkalia-register-step6__input-icon" alt="">
              <input type="password" class="parkalia-register-step6__input parkalia-register-step6__input--password" placeholder="********">
              <button type="button" class="parkalia-register-step6__toggle-password">
                <img src="/frontend/public/assets/icons/icon_open-eye.svg" alt="">
              </button>
            </div>
          </div>
          <div class="parkalia-register-step6__field">
            <label class="parkalia-register-step6__label">Confirmar contraseña</label>
            <div class="parkalia-register-step6__input-wrapper">
              <img src="/frontend/public/assets/icons/icon_password.svg" class="parkalia-register-step6__input-icon" alt="">
              <input type="password" class="parkalia-register-step6__input" placeholder="********">
            </div>
          </div>
          <div class="parkalia-register-step6__button-primary">
            <a href="/frontend/src/html/pages/view_parkalia_login.html" class="parkalia-btn parkalia-btn--primary parkalia-btn--expand">
                <span class="parkalia-btn__text">Verificar código</span>
                <img src="/frontend/public/assets/icons/icon_mail-check.svg" alt="" class="parkalia-btn__icon">
            </a>
          </div>
        </form>
      </div>
    </section>
    <aside class="parkalia-register-step6-banner">
      <img src="/frontend/public/assets/images/img_banking7.webp" alt="parkalia" class="parkalia-register-step1-banner__image">
      <div class="parkalia-register-step6-banner__overlay"></div>
      <div class="parkalia-register-step6-banner__card">
        <span class="parkalia-register-step6-banner__badge">parkalia SECURITY</span>
        <h6 class="parkalia-register-step6-banner__title">Seguridad avanzada</h6>
        <p class="parkalia-register-step6-banner__text">Protegemos tu cuenta con tecnología de última generación.</p>
      </div>
    </aside>
  </div>
</section>
